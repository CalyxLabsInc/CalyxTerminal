[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calyx-terminal"
version = "1.0.0"
description = "A VT-compatible neon-pink terminal emulator for Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "pyside6-qtermwidget>=0.5.6.11.1,<0.6",
]
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Calyx Terminal Project"}]

[project.scripts]
calyx-terminal = "calyx_terminal.application:run"

[tool.setuptools]
packages = ["calyx_terminal"]
include-package-data = true

[tool.setuptools.package-data]
calyx_terminal = ["assets/*.png", "assets/*.svg", "assets/*.colorscheme"]
